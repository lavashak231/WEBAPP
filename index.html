<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ورود با شماره</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            padding: 20px;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
        }
        h1 { font-size: 22px; text-align: center; margin-bottom: 10px; }
        p { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
        label { display: block; font-size: 14px; margin-bottom: 8px; font-weight: bold; }
        input {
            width: 100%;
            padding: 15px;
            font-size: 17px;
            border: 2px solid #ddd;
            border-radius: 10px;
            direction: ltr;
            text-align: left;
            outline: none;
        }
        input:focus { border-color: #2481cc; }
        button {
            width: 100%;
            padding: 15px;
            background: #2481cc;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        .success {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            font-size: 15px;
            line-height: 1.8;
        }
        .copied-phone {
            background: #fff3cd;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 16px;
            direction: ltr;
        }
    </style>
</head>
<body>
    <h1>📱 ورود با شماره</h1>
    <p>شماره تلفن خود را وارد کنید</p>
    
    <label for="phone">شماره (با کد کشور):</label>
    <input type="tel" id="phone" placeholder="+989123456789" dir="ltr">
    
    <button id="btn" onclick="sendPhone()">📋 کپی شماره و بازگشت به چت</button>
    
    <div id="success" class="success">
        ✅ <b>شماره کپی شد!</b><br><br>
        حالا به چت ربات برگرد و<br>
        توی کادر تایپ، <b>پیست</b> کن و بفرست 👇
        <div class="copied-phone" id="copiedPhone"></div>
    </div>

    <script>
        var tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        function sendPhone() {
            var phone = document.getElementById('phone').value.trim();
            
            if (!phone) {
                tg.showAlert('لطفاً شماره را وارد کنید');
                return;
            }
            
            if (phone.charAt(0) !== '+') {
                tg.showAlert('شماره باید با + شروع شود\nمثال: +989123456789');
                return;
            }
            
            // کپی توی clipboard
            navigator.clipboard.writeText(phone).then(function() {
                document.getElementById('copiedPhone').textContent = phone;
                document.getElementById('success').style.display = 'block';
                document.getElementById('btn').style.display = 'none';
                
                setTimeout(function() {
                    tg.close();
                }, 2500);
            }).catch(function(err) {
                // اگه clipboard کار نکرد، شماره رو نشون بده تا دستی کپی کنه
                document.getElementById('copiedPhone').textContent = phone;
                document.getElementById('success').style.display = 'block';
                document.getElementById('btn').style.display = 'none';
                
                setTimeout(function() {
                    tg.close();
                }, 3000);
            });
        }
        
        setTimeout(function() { document.getElementById('phone').focus(); }, 300);
    </script>
</body>
</html>
