<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ورود با شماره</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .icon {
            font-size: 64px;
            margin-bottom: 15px;
            display: block;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .header p {
            color: var(--tg-theme-hint-color, #999);
            font-size: 14px;
        }
        
        .warning {
            background: rgba(255, 152, 0, 0.12);
            border-right: 4px solid #ff9800;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .phone-wrapper {
            position: relative;
        }
        
        .flag {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 22px;
            pointer-events: none;
        }
        
        input {
            width: 100%;
            padding: 16px;
            padding-right: 55px;
            border-radius: 12px;
            border: 2px solid var(--tg-theme-secondary-bg-color, #eee);
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000);
            font-size: 18px;
            outline: none;
            transition: border-color 0.2s;
            font-family: 'Courier New', monospace;
            direction: ltr;
            text-align: left;
        }
        
        input:focus {
            border-color: var(--tg-theme-button-color, #2481cc);
        }
        
        input::placeholder {
            color: var(--tg-theme-hint-color, #999);
            font-size: 15px;
        }
        
        button {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        button:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .spinner {
            display: none;
            margin: 0 auto 20px;
            width: 40px;
            height: 40px;
            border: 3px solid var(--tg-theme-secondary-bg-color, #eee);
            border-top-color: var(--tg-theme-button-color, #2481cc);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="icon">📱</span>
            <h1>ورود با شماره</h1>
            <p>شماره تلفن خود را وارد کنید</p>
        </div>
        
        <div class="warning">
            ⚠️ با ادامه، موافقت می‌کنید که کد تأیید برای شما ارسال شود.
        </div>
        
        <div id="spinner" class="spinner"></div>
        
        <div class="input-group">
            <label for="phone">شماره تلفن (با کد کشور)</label>
            <div class="phone-wrapper">
                <input 
                    type="tel" 
                    id="phone" 
                    placeholder="+989123456789"
                    autocomplete="tel"
                    inputmode="tel"
                    dir="ltr"
                >
                <span class="flag" id="flag">🌍</span>
            </div>
        </div>
        
        <button onclick="submitPhone()" id="submitBtn">
            ارسال کد تأیید
        </button>
        
        <div class="footer">
            🔒 اطلاعات شما امن است
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        const phoneInput = document.getElementById('phone');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const flagEl = document.getElementById('flag');
        
        // پرچم کشورها
        const flags = {
            '98':'🇮🇷','1':'🇺🇸','44':'🇬🇧','49':'🇩🇪','90':'🇹🇷','7':'🇷🇺',
            '971':'🇦🇪','966':'🇸🇦','964':'🇮🇶','20':'🇪🇬','91':'🇮🇳','92':'🇵🇰',
            '93':'🇦🇫','994':'🇦🇿','374':'🇦🇲','995':'🇬🇪','33':'🇫🇷','39':'🇮🇹',
            '34':'🇪🇸','31':'🇳🇱','46':'🇸🇪','47':'🇳🇴','45':'🇩🇰','358':'🇫🇮',
            '48':'🇵🇱','380':'🇺🇦','60':'🇲🇾','62':'🇮🇩','63':'🇵🇭','66':'🇹🇭',
            '84':'🇻🇳','86':'🇨🇳','81':'🇯🇵','82':'🇰🇷','61':'🇦🇺','64':'🇳🇿',
            '27':'🇿🇦','234':'🇳🇬','254':'🇰🇪','55':'🇧🇷','54':'🇦🇷','52':'🇲🇽',
            '57':'🇨🇴','56':'🇨🇱','51':'🇵🇪','58':'🇻🇪','972':'🇮🇱','961':'🇱🇧',
            '962':'🇯🇴','965':'🇰🇼','974':'🇶🇦','973':'🇧🇭','968':'🇴🇲','967':'🇾🇪',
            '963':'🇸🇾','212':'🇲🇦','213':'🇩🇿','216':'🇹🇳','218':'🇱🇾','249':'🇸🇩'
        };
        
        phoneInput.addEventListener('input', function(e) {
            let value = e.target.value;
            value = value.replace(/[^\d+]/g, '');
            
            if (value.includes('+') && !value.startsWith('+')) {
                value = '+' + value.replace(/\+/g, '');
            }
            
            const plusCount = (value.match(/\+/g) || []).length;
            if (plusCount > 1) {
                value = '+' + value.replace(/\+/g, '');
            }
            
            e.target.value = value;
            updateFlag(value);
        });
        
        function updateFlag(phone) {
            if (!phone || !phone.startsWith('+')) {
                flagEl.textContent = '🌍';
                return;
            }
            
            const digits = phone.substring(1);
            for (let len of [1, 2, 3]) {
                const code = digits.substring(0, len);
                if (flags[code]) {
                    flagEl.textContent = flags[code];
                    return;
                }
            }
            flagEl.textContent = '🌍';
        }
        
        function submitPhone() {
            const phone = phoneInput.value.trim();
            
            if (!phone) {
                tg.showAlert('❌ لطفاً شماره تلفن خود را وارد کنید');
                return;
            }
            
            if (!phone.startsWith('+')) {
                tg.showAlert('❌ شماره باید با + شروع شود\nمثال: +989123456789');
                return;
            }
            
            const digits = phone.substring(1);
            if (digits.length < 8 || digits.length > 15) {
                tg.showAlert('❌ شماره نامعتبر است');
                return;
            }
            
            if (!/^\+\d{8,15}$/.test(phone)) {
                tg.showAlert('❌ فرمت شماره اشتباه است');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ در حال ارسال...';
            spinner.style.display = 'block';
            
            const data = JSON.stringify({
                phone: phone,
                action: "send_code",
                timestamp: Date.now()
            });
            
            try {
                tg.sendData(data);
                setTimeout(() => tg.close(), 500);
            } catch (error) {
                tg.showAlert('❌ خطا در ارسال: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'ارسال کد تأیید';
                spinner.style.display = 'none';
            }
        }
        
        phoneInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') submitPhone();
        });
        
        setTimeout(() => phoneInput.focus(), 300);
    </script>
</body>
</html>
