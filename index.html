<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="padding: 20px; font-family: Tahoma; text-align: center;">
    <h1>تست sendData</h1>
    
    <p id="status">در حال بررسی...</p>
    
    <input type="text" id="phone" value="+989123456789" 
           style="padding: 10px; font-size: 16px; width: 80%;">
    
    <br><br>
    
    <button onclick="test()" 
            style="padding: 15px 30px; font-size: 18px; background: #2481cc; 
                   color: white; border: none; border-radius: 10px;">
        ارسال
    </button>
    
    <p id="result" style="font-size: 14px;"></p>

    <script>
        var status = document.getElementById('status');
        var result = document.getElementById('result');
        var tg = window.Telegram ? window.Telegram.WebApp : null;
        
        if (tg) {
            tg.expand();
            tg.ready();
            status.textContent = "✅ Telegram WebApp لود شد";
            status.style.color = "green";
        } else {
            status.textContent = "❌ Telegram WebApp لود نشد";
            status.style.color = "red";
        }
        
        function test() {
            var phone = document.getElementById('phone').value;
            
            result.textContent = "در حال ارسال...";
            result.style.color = "blue";
            
            if (!tg) {
                result.textContent = "❌ tg موجود نیست!";
                result.style.color = "red";
                return;
            }
            
            try {
                var data = JSON.stringify({ phone: phone });
                tg.sendData(data);
                result.textContent = "✅ sendData صدا زده شد! داده: " + data;
                result.style.color = "green";
            } catch(e) {
                result.textContent = "❌ خطا: " + e.message;
                result.style.color = "red";
            }
        }
    </script>
</body>
</html>
